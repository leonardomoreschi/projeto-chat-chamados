[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Sem estas três seções o `supervisorctl status` dentro do container falha com
; "unix:///run/supervisord.sock no such file" — não havia como inspecionar os
; programas em execução.
[unix_http_server]
file=/var/run/supervisord.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ratchet]
command=php /var/www/html/bin/chat-server.php
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/supervisor/ratchet.err.log
stdout_logfile=/var/log/supervisor/ratchet.out.log
user=www-data
stopwaitsecs=10
stopsignal=TERM

; Política de restart agressiva para alta disponibilidade
exitcodes=0

; Envio de Web Push. Separado do ratchet porque a chamada aos endpoints
; FCM/Mozilla é HTTP bloqueante e travaria o loop de 0,8s do WebSocket.
[program:push-worker]
command=php /var/www/html/bin/push-worker.php
autostart=true
autorestart=true
startretries=10
startsecs=5
stderr_logfile=/var/log/supervisor/push-worker.err.log
stdout_logfile=/var/log/supervisor/push-worker.out.log
user=www-data
stopwaitsecs=15
stopsignal=TERM
exitcodes=0