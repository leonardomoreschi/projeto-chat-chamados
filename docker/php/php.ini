; ============================================
; Configurações Otimizadas para Chat Interno
; ============================================

[PHP]
; Timezone corporativo
date.timezone = America/Sao_Paulo

; Uploads (10MB conforme README)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; Memória e performance
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Logs
log_errors = On
error_log = /var/www/html/var/logs/php_errors.log
display_errors = Off
display_startup_errors = Off

; Sessões — 7 dias (604800s). O cookie e o gc_maxlifetime efetivos são
; reajustados por public/index.php a partir de SESSION_LIFETIME_DIAS do .env;
; os valores aqui valem para qualquer script que não passe por ele.
; save_path fica em volume nomeado (sessions_data): em /tmp toda recriação do
; container derrubava todo mundo para a tela de login.
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.gc_maxlifetime = 604800
session.cookie_lifetime = 604800
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Lax
session.use_strict_mode = 1

; OPcache (aceleração)
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1