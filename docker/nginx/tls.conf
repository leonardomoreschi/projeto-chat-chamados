# ============================================
# Servidor HTTPS (:443).
#
# O entrypoint copia este arquivo para conf.d/ SOMENTE quando encontra
# /etc/nginx/certs/chat.crt e chat.key — sem isso o nginx nem sobe, e derrubar
# o sistema inteiro por falta de certificado seria péssimo negócio.
#
# É este bloco que torna as notificações possíveis: o navegador só expõe a
# Notification API e o Service Worker em contexto seguro. Ver docs/notificacoes.md.
# ============================================

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate     /etc/nginx/certs/chat.crt;
    ssl_certificate_key /etc/nginx/certs/chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Sem HSTS de propósito: o sistema continua acessível por http://<ip>:8188
    # durante a transição, e o HSTS gravado no navegador transformaria isso num
    # ERR_SSL_PROTOCOL_ERROR difícil de reverter na máquina do usuário.

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 12M;
    client_body_buffer_size 128k;

    fastcgi_read_timeout 300s;
    proxy_read_timeout 300s;

    include /etc/nginx/snippets/app.conf;
}
