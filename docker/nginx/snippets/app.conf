# ============================================
# Locations da aplicação — compartilhados pelos servidores :80 e :443.
#
# Está num snippet porque duplicar isto nos dois blocos foi, historicamente, a
# fonte do "funciona em HTTP e quebra em HTTPS": bastava alguém acrescentar uma
# rota num bloco e esquecer do outro.
# ============================================

# Health check do docker compose (usa http://localhost/health).
location /health {
    access_log off;
    return 200 "OK";
    add_header Content-Type text/plain;
}

# Service Worker: precisa ser servido da raiz para valer no escopo "/", e NUNCA
# com o cache longo dos demais estáticos — senão o navegador segura uma versão
# antiga do sw.js por até um ano.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
    access_log off;
}

location = /manifest.json {
    add_header Cache-Control "no-cache";
    expires off;
    access_log off;
}

# Canal de tempo real. Sob HTTPS o navegador recusa ws:// por mixed content,
# então a página segura fala wss://<host>/ws e o nginx faz o upgrade daqui para
# o container do Ratchet.
location /ws {
    proxy_pass http://websocket:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O socket fica aberto o dia inteiro; o keepalive do front é de 25s, mas o
    # timeout precisa de folga para não derrubar conexão ociosa legítima.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Estáticos com cache longo — as URLs são versionadas por asset() (?v=mtime).
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Bloquear acesso a arquivos sensíveis
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ /(vendor|config|bin) {
    deny all;
    return 404;
}

# Regra principal: Slim Framework routing
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Processar PHP via PHP-FPM
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php-fpm;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Sem isto o PHP não sabe que a requisição veio por TLS e o cookie de
    # sessão sai sem a flag Secure (vazio = http, "on" = https).
    fastcgi_param HTTPS $https if_not_empty;

    # Configurações de buffer
    fastcgi_buffering on;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 16k;
}
