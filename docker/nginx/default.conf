# ============================================
# Nginx + PHP-FPM para Slim Framework — servidor HTTP (:80)
#
# Os `location` moram em snippets/app.conf, compartilhados com o bloco TLS
# (tls.conf), que o entrypoint só habilita quando existe certificado em
# /etc/nginx/certs. Ver docs/notificacoes.md §TLS.
# ============================================

upstream php-fpm {
    server php:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Limites de upload (sincronizar com PHP)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Timeouts para requisições longas
    fastcgi_read_timeout 300s;
    proxy_read_timeout 300s;

    include /etc/nginx/snippets/app.conf;
}
